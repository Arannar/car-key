<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1284" width="720" height="1284">
  <defs>
    <linearGradient id="bodyX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9aeb5"/>
      <stop offset="0.12" stop-color="#d9dce1"/>
      <stop offset="0.3" stop-color="#f6f7f8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f6f7f8"/>
      <stop offset="0.88" stop-color="#d9dce1"/>
      <stop offset="1" stop-color="#a9aeb5"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
