  <path d="M 60 241 C 120 230 180 222 232 216 C 330 206 470 202 586 201" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.9"/>
  <path d="M 70 262 C 200 252 420 246 626 240" fill="none" stroke="#aeb3ba" stroke-width="1" stroke-opacity="0.6"/>
  <!-- door cut lines -->
  <path d="M 258 214 C 256 240 258 270 262 296" fill="none" stroke="#9aa0a8" stroke-width="1.2"/>
  <path d="M 395 204 L 396 298" fill="none" stroke="#9aa0a8" stroke-width="1.2"/>
  <path d="M 520 200 C 530 230 528 270 516 296" fill="none" stroke="#9aa0a8" stroke-width="1.2"/>
  <!-- flush door handles -->
  <rect x="345" y="222" width="30" height="5" rx="2.5" fill="#c4c8ce" stroke="#9aa0a8" stroke-width="0.8"/>
  <rect x="470" y="220" width="30" height="5" rx="2.5" fill="#c4c8ce" stroke="#9aa0a8" stroke-width="0.8"/>
  <!-- mirror -->
  <path fill="#e9ebee" stroke="#a7acb3" stroke-width="1" d="M 246 205 C 238 196 246 189 262 190 C 272 191 274 199 268 205 Z"/>
  <path fill="#1a1c20" d="M 252 206 L 266 206 L 264 211 L 254 211 Z"/>
  <!-- headlight -->
  <path fill="#1d2127" d="M 38 248 C 52 240 76 236 96 236 C 90 243 70 249 44 254 Z"/>
  <path fill="none" stroke="#e8f1ff" stroke-width="1.6" stroke-linecap="round" d="M 46 250 C 60 244 76 240 90 239"/>
  <!-- front bumper detail -->
  <path d="M 36 270 C 50 268 70 268 86 270" fill="none" stroke="#9aa0a8" stroke-width="1"/>
