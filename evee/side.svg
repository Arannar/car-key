  <path d="M 600 226 L 616 228 L 615 240 L 600 238 Z" fill="none" stroke="#a7acb3" stroke-width="0.8"/>
  <!-- wheel wells -->
  <g clip-path="url(#archClip)"><circle cx="139" cy="287" r="51" fill="#0c0d10"/><circle cx="507" cy="287" r="51" fill="#0c0d10"/></g>
  <!-- wheels -->
  <use href="#wheel" x="139" y="287"/>
  <use href="#wheel" x="507" y="287"/>
