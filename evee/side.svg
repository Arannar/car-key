<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f1f2f4"/>
      <stop offset="0.62" stop-color="#d9dce1"/>
      <stop offset="0.8" stop-color="#c3c7cd"/>
      <stop offset="1" stop-color="#9ea3aa"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#eef3ff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#fff7ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="0.5" stop-color="#14171c"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="glassHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#d7dadf"/>
      <stop offset="0.6" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#5d636b"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClip"><rect x="0" y="0" width="660" height="300"/></clipPath>
    <g id="wheel">
      <circle r="44" fill="#121316"/>
      <circle r="43" fill="none" stroke="#2a2c31" stroke-width="2"/>
      <circle r="33" fill="url(#rim)"/>
      <circle r="33" fill="none" stroke="#3b3f45" stroke-width="1.5"/>
      <g fill="#6c727a" opacity="0.9">
        <path d="M0 -6 L5 -30 A31 31 0 0 1 17 -25 Z"/>
        <path d="M0 -6 L5 -30 A31 31 0 0 1 17 -25 Z" transform="rotate(72)"/>
        <path d="M0 -6 L5 -30 A31 31 0 0 1 17 -25 Z" transform="rotate(144)"/>
        <path d="M0 -6 L5 -30 A31 31 0 0 1 17 -25 Z" transform="rotate(216)"/>
        <path d="M0 -6 L5 -30 A31 31 0 0 1 17 -25 Z" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#4a4f56"/>
      <circle r="4" fill="#c9ccd1"/>
    </g>
  </defs>
  <g transform="translate(0,-26)">
  <ellipse cx="330" cy="334" rx="320" ry="16" fill="url(#shadow)"/>
  <!-- body -->
  <path id="bodyPath" fill="url(#body)" d="
    M 32 272
    C 26 258 30 247 44 241
    C 80 229 140 220 215 212
    C 250 196 285 168 318 152
    C 350 142 392 141 430 146
    C 485 154 545 178 588 196
    L 622 204
    C 630 210 633 230 632 262
    C 631 280 626 292 612 298
    L 560 300
    A 54 54 0 0 0 454 300
    L 192 300
    A 54 54 0 0 0 86 300
    L 52 298
    C 42 294 37 286 34 276 Z"/>
  <path fill="url(#pearl)" d="M 34 276 C 28 262 30 250 40 244 C 70 232 130 222 215 212 C 250 196 285 168 318 152 C 350 142 392 141 430 146 C 485 154 545 178 588 196 L 622 204 C 630 210 633 230 632 262 C 631 280 626 292 612 298 L 52 298 Z"/>
